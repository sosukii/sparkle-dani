name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore optimized images
        id: images-cache
        uses: actions/cache/restore@v4
        with:
          path: public/_img
          key: images-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
      - name: Prepare optimized images and fonts
        run: npm run assets
      - name: Save optimized images
        if: always() && steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/_img
          key: images-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:visual
      - name: Static build (GitHub Pages) smoke tests
        run: npm run test:static
      - name: Upload Playwright report and failed screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
            tests/visual/__screenshots__
          retention-days: 7
