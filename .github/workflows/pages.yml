name: Deploy to GitHub Pages

# Публикуем только то, что прошло CI на main (lint, типы, unit, e2e, скриншоты). Можно запустить и вручную.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore optimized images
        id: images-cache
        uses: actions/cache/restore@v4
        with:
          path: public/_img
          key: images-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
      - name: Prepare optimized images and fonts
        run: npm run assets
      - name: Save optimized images
        if: always() && steps.images-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: public/_img
          key: images-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}
      - name: Build static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output-static/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сообщение в Telegram со ссылкой на новый деплой. Работает, только если в настройках репозитория заданы секреты
  # TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID (см. README); без них шаг тихо пропускается. Токен нигде не печатается.
  notify:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
      CHANGE: ${{ github.event.workflow_run.display_title || 'ручной запуск' }}
    steps:
      - name: Отправить ссылку в Telegram
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=NOCTURNE: деплой обновлён ✅
          ${CHANGE}
          ${PAGE_URL}" > /dev/null
